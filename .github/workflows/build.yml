name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore Pomidoro.sln

      - name: Build
        run: dotnet build Pomidoro.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/Pomidoro.Tests/Pomidoro.Tests.csproj -c Release --no-build --verbosity normal
